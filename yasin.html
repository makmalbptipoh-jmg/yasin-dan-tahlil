<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#064c39"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>Yasin dan Tahlil — Yasin</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#064c39",
            "bg-light": "#f5f7f6",
            "bg-dark": "#0e1f1a",
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            arab: ["Amiri", "Georgia", "serif"],
          }
        }
      }
    }
  </script>

  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .icon-filled { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
    body { min-height: max(884px, 100dvh); }
    .pb-nav { padding-bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); }
    .nav-safe { padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px)); }
    #ayahList::-webkit-scrollbar { display: none; }
    #ayahList { scrollbar-width: none; }
    .no-select { -webkit-user-select: none; user-select: none; }
    .ayah-card {
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .ayah-card:active { transform: scale(0.99); }
    .bm-icon-on { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>

<body class="bg-bg-light dark:bg-bg-dark font-sans text-slate-900 dark:text-slate-100">

  <!-- STICKY HEADER -->
  <header class="sticky top-0 z-40 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 px-5 pt-safe">
    <div class="pt-3 pb-2 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="index.html"
          class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center active:bg-primary/20 transition">
          <span class="material-symbols-outlined text-primary" style="font-size:20px">arrow_back</span>
        </a>
        <div>
          <h1 class="text-base font-bold text-primary leading-tight">Surah Yasin</h1>
          <p id="metaLine" class="text-[11px] text-slate-400">Surah 36</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <div id="progressBadge"
          class="text-[11px] font-bold text-primary bg-primary/10 px-2.5 py-1 rounded-full hidden">
        </div>
        <button id="openSettings"
          class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center active:bg-primary/20 transition">
          <span class="material-symbols-outlined text-primary" style="font-size:20px">tune</span>
        </button>
      </div>
    </div>

    <!-- Controls row -->
    <div class="py-2.5 flex items-center justify-between gap-2">
      <label class="flex items-center gap-1.5 text-xs font-medium bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-full cursor-pointer">
        <input id="toggleMs" type="checkbox" class="rounded accent-primary"/>
        Terjemahan
      </label>

      <div class="flex items-center gap-1.5">
        <button id="btnMinus"
          class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center active:bg-slate-200 dark:active:bg-slate-700 transition">
          <span class="material-symbols-outlined" style="font-size:18px">remove</span>
        </button>
        <button id="btnPlus"
          class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center active:bg-slate-200 dark:active:bg-slate-700 transition">
          <span class="material-symbols-outlined" style="font-size:18px">add</span>
        </button>
        <div class="w-px h-6 bg-slate-200 dark:bg-slate-700"></div>
        <button id="prevAyah"
          class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center active:bg-slate-200 dark:active:bg-slate-700 transition">
          <span class="material-symbols-outlined" style="font-size:20px">chevron_left</span>
        </button>
        <button id="nextAyah"
          class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center active:bg-slate-200 dark:active:bg-slate-700 transition">
          <span class="material-symbols-outlined" style="font-size:20px">chevron_right</span>
        </button>
      </div>
    </div>
  </header>

  <main class="px-5 py-5 pb-nav">

    <!-- Basmalah -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl px-5 py-6 shadow-sm border border-slate-100 dark:border-slate-700 mb-4">
      <p class="font-arab text-center no-select text-primary dark:text-emerald-300"
        dir="rtl"
        style="font-size:32px; line-height:2.2;">
        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
      </p>
    </div>

    <!-- Status / loading -->
    <p id="status" class="text-sm text-slate-400 text-center py-4"></p>

    <!-- Ayah cards (horizontal snap scroll) -->
    <div id="ayahList"
      class="flex gap-4 overflow-x-auto snap-x snap-mandatory pb-2"
      style="-webkit-overflow-scrolling: touch;">
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 px-2 pt-2 nav-safe z-50">
    <div class="flex justify-between items-center max-w-lg mx-auto">
      <a class="flex flex-col items-center gap-0.5 flex-1 text-slate-400 dark:text-slate-500" href="index.html">
        <span class="material-symbols-outlined">home</span>
        <span class="text-[10px]">Utama</span>
      </a>
      <a class="flex flex-col items-center gap-0.5 flex-1 text-primary" href="yasin.html">
        <span class="material-symbols-outlined icon-filled">auto_stories</span>
        <span class="text-[10px] font-bold">Yasin</span>
      </a>
      <a class="flex flex-col items-center gap-0.5 flex-1 text-slate-400 dark:text-slate-500" href="tahlil.html">
        <span class="material-symbols-outlined">mosque</span>
        <span class="text-[10px]">Tahlil</span>
      </a>
      <a class="flex flex-col items-center gap-0.5 flex-1 text-slate-400 dark:text-slate-500" href="bookmark.html">
        <span class="material-symbols-outlined">bookmark</span>
        <span class="text-[10px]">Simpan</span>
      </a>
      <a class="flex flex-col items-center gap-0.5 flex-1 text-slate-400 dark:text-slate-500" href="settings.html">
        <span class="material-symbols-outlined">settings</span>
        <span class="text-[10px]">Tetapan</span>
      </a>
    </div>
  </nav>

  <!-- SETTINGS SHEET -->
  <div id="sheet" class="fixed inset-0 z-50 hidden">
    <div id="sheetBg" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="absolute left-0 right-0 bottom-0 bg-white dark:bg-slate-900 rounded-t-3xl p-5 shadow-2xl">
      <div class="w-10 h-1 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-4"></div>
      <div class="flex items-center justify-between mb-4">
        <p class="font-bold text-base">Paparan</p>
        <button id="closeSettings"
          class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center active:bg-slate-200 transition">
          <span class="material-symbols-outlined" style="font-size:18px">close</span>
        </button>
      </div>

      <div class="space-y-2.5">
        <!-- Dark mode -->
        <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800 rounded-2xl px-4 py-3.5">
          <div>
            <p class="font-semibold text-sm">Tema Gelap</p>
            <p class="text-xs text-slate-400 mt-0.5">Tukar antara cerah / gelap</p>
          </div>
          <button id="toggleDark"
            class="relative w-12 h-6 rounded-full transition-colors duration-200 focus:outline-none"
            aria-pressed="false">
            <span class="absolute inset-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-200 translate-x-0"></span>
          </button>
        </div>

        <!-- Font size info -->
        <div class="bg-slate-50 dark:bg-slate-800 rounded-2xl px-4 py-3.5">
          <p class="font-semibold text-sm mb-0.5">Saiz Teks Arab</p>
          <p class="text-xs text-slate-400">Guna butang + / − di bar kawalan</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LS_SHOW_MS  = "yt_show_ms";
    const LS_AR_SIZE  = "yt_ar_size";
    const LS_LAST_READ = "yt_last_read";
    const LS_BOOKMARKS = "yt_bookmarks";
    const LS_DARK     = "yt_dark";
    const TOTAL_AYAH  = 83;

    let state = { showMs: true, arSize: 30 };
    let currentAyah = 1;

    /* ── DARK MODE ─────────────────────────────────────────── */
    function applyDarkMode() {
      const on = localStorage.getItem(LS_DARK) === "1";
      document.documentElement.classList.toggle("dark", on);
      const btn = document.getElementById("toggleDark");
      if (!btn) return;
      btn.setAttribute("aria-pressed", String(on));
      btn.className = on
        ? "relative w-12 h-6 rounded-full bg-primary transition-colors duration-200 focus:outline-none"
        : "relative w-12 h-6 rounded-full bg-slate-300 dark:bg-slate-600 transition-colors duration-200 focus:outline-none";
      const knob = btn.querySelector("span");
      knob.className = on
        ? "absolute inset-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-200 translate-x-6"
        : "absolute inset-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-200 translate-x-0";
    }

    /* ── BOOKMARKS ─────────────────────────────────────────── */
    function getBookmarks() {
      try { const a = JSON.parse(localStorage.getItem(LS_BOOKMARKS) || "[]"); return Array.isArray(a) ? a : []; } catch { return []; }
    }
    function saveBookmarks(arr) { localStorage.setItem(LS_BOOKMARKS, JSON.stringify(arr)); }
    function isBookmarked(n) { return getBookmarks().includes("yasin:" + n); }
    function toggleBookmark(n) {
      const arr = getBookmarks();
      const key = "yasin:" + n;
      const i = arr.indexOf(key);
      if (i >= 0) arr.splice(i, 1); else arr.push(key);
      saveBookmarks(arr);
      return arr.includes(key);
    }

    /* ── LAST READ ─────────────────────────────────────────── */
    function saveLastRead(ayah) {
      localStorage.setItem(LS_LAST_READ, JSON.stringify({ type: "yasin", ayah }));
    }

    /* ── DISPLAY HELPERS ───────────────────────────────────── */
    function setShowMs(v) {
      state.showMs = v;
      localStorage.setItem(LS_SHOW_MS, v ? "1" : "0");
      document.querySelectorAll("[data-ms]").forEach(el => { el.style.display = v ? "" : "none"; });
    }

    function setArabSize(px) {
      const next = Math.max(22, Math.min(48, px));
      state.arSize = next;
      localStorage.setItem(LS_AR_SIZE, String(next));
      document.querySelectorAll("[data-ar]").forEach(el => {
        el.style.fontSize = next + "px";
        el.style.lineHeight = next > 36 ? "2.4" : "2.1";
      });
    }

    /* ── PROGRESS BADGE ────────────────────────────────────── */
    function updateProgressBadge(ayah) {
      currentAyah = ayah;
      const el = document.getElementById("progressBadge");
      el.textContent = ayah + " / " + TOTAL_AYAH;
      el.classList.remove("hidden");
    }

    /* ── SCROLL TO AYAH ────────────────────────────────────── */
    function scrollToAyah(n) {
      const el = document.getElementById("ayah-" + n);
      if (!el) return;
      el.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
      updateProgressBadge(n);
    }

    /* ── GET CURRENT AYAH FROM SCROLL ──────────────────────── */
    function getCurrentAyah() {
      const list = document.getElementById("ayahList");
      const cards = list.querySelectorAll("[id^='ayah-']");
      if (!cards.length) return 1;
      const cx = list.getBoundingClientRect().left + list.offsetWidth / 2;
      let best = null, bestD = Infinity;
      cards.forEach(c => {
        const r = c.getBoundingClientRect();
        const d = Math.abs(r.left + r.width / 2 - cx);
        if (d < bestD) { bestD = d; best = c; }
      });
      return best ? Number(best.id.replace("ayah-", "")) : 1;
    }

    /* ── BASMALAH STRIP ────────────────────────────────────── */
    function stripBasmalah(ar) {
      const t = String(ar || "").trim();
      const plain = t.replace(/[ؐ-ًؚ-ٟۖ-ۭ]/g, "");
      const bas = "بسم الله الرحمن الرحيم";
      if (!plain.startsWith(bas)) return t;
      for (const end of ["الرَّحِيمِ", "الرَّحِيم", "الرحيم"]) {
        const i = t.indexOf(end);
        if (i >= 0 && i < 250) { const r = t.slice(i + end.length).trim(); return r || t; }
      }
      return plain.slice(bas.length).trim() || t;
    }

    /* ── LOAD DATA ─────────────────────────────────────────── */
    async function loadYasin() {
      const status = document.getElementById("status");
      const list = document.getElementById("ayahList");
      status.textContent = "Memuatkan data…";

      try {
        const r = await fetch("data/yasin.json");
        if (!r.ok) throw new Error();
        const j = await r.json();
        document.getElementById("metaLine").textContent = "Surah " + (j?.meta?.surah ?? 36);
        list.innerHTML = "";
        status.textContent = "";

        for (const a of j.ayahs) {
          const ayah = Number(a.aya);
          const bm = isBookmarked(ayah);
          const arText = (ayah === 1) ? stripBasmalah(a.ar) : (a.ar || "");

          const card = document.createElement("div");
          card.id = "ayah-" + ayah;
          card.className = "ayah-card snap-start shrink-0 w-[88vw] max-w-[540px] bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col";

          card.innerHTML = `
            <div class="px-4 pt-4 pb-3 flex items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-700">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0">
                  <span class="text-white text-xs font-bold">${ayah}</span>
                </div>
                <span class="text-xs text-slate-400 font-medium">Ayat ${ayah}</span>
              </div>
              <div class="flex items-center gap-1">
                <button data-last="${ayah}"
                  class="flex items-center gap-1 text-[11px] font-semibold text-primary bg-primary/10 px-2.5 py-1.5 rounded-full active:bg-primary/20 transition">
                  <span class="material-symbols-outlined" style="font-size:14px">history</span>
                  Tanda
                </button>
                <button data-bm="${ayah}"
                  class="w-8 h-8 rounded-full flex items-center justify-center active:bg-slate-100 dark:active:bg-slate-700 transition">
                  <span class="material-symbols-outlined text-slate-400 ${bm ? "bm-icon-on !text-amber-500" : ""}" style="font-size:20px">bookmark</span>
                </button>
              </div>
            </div>

            <div class="px-5 py-5 flex-1 flex items-center justify-center">
              <p data-ar class="font-arab text-right no-select w-full text-primary dark:text-emerald-200" dir="rtl"></p>
            </div>

            <div data-ms class="px-4 pb-4">
              <div class="bg-bg-light dark:bg-slate-900/60 rounded-xl px-4 py-3">
                <p class="text-[11px] font-bold uppercase tracking-widest text-primary/40 mb-1">Terjemahan</p>
                <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed"></p>
              </div>
            </div>
          `;

          card.querySelector("[data-ar]").textContent = arText;
          card.querySelector("[data-ms] p:last-child").textContent = a.ms || "";

          card.querySelector("[data-bm]").addEventListener("click", ev => {
            const n = Number(ev.currentTarget.dataset.bm);
            const on = toggleBookmark(n);
            const icon = ev.currentTarget.querySelector("span");
            icon.className = on
              ? "material-symbols-outlined text-amber-500 bm-icon-on"
              : "material-symbols-outlined text-slate-400";
            icon.style.fontSize = "20px";
          });

          card.querySelector("[data-last]").addEventListener("click", ev => {
            saveLastRead(ayah);
            const btn = ev.currentTarget;
            const orig = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined" style="font-size:14px">check</span> Ditanda`;
            setTimeout(() => { btn.innerHTML = orig; }, 1200);
          });

          list.appendChild(card);
        }

        // Restore settings
        state.showMs = localStorage.getItem(LS_SHOW_MS) !== "0";
        state.arSize = Number(localStorage.getItem(LS_AR_SIZE)) || 30;
        document.getElementById("toggleMs").checked = state.showMs;
        setShowMs(state.showMs);
        setArabSize(state.arSize);

        // Scroll to target ayah
        const qAyah = Number(new URLSearchParams(location.search).get("ayah"));
        let target = Number.isFinite(qAyah) && qAyah > 0 ? qAyah : null;
        if (!target) {
          try {
            const d = JSON.parse(localStorage.getItem(LS_LAST_READ) || "null");
            if (d?.type === "yasin" && d.ayah) target = Number(d.ayah);
          } catch {}
        }
        if (target) setTimeout(() => scrollToAyah(target), 250);
        else updateProgressBadge(1);

        // Track progress on scroll
        list.addEventListener("scroll", () => {
          const cur = getCurrentAyah();
          if (cur !== currentAyah) updateProgressBadge(cur);
        }, { passive: true });

        // Swipe support
        let sx = 0, sy = 0;
        list.addEventListener("touchstart", e => {
          if (!e.touches.length) return;
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
        }, { passive: true });
        list.addEventListener("touchend", e => {
          const t = e.changedTouches?.[0];
          if (!t) return;
          const dx = t.clientX - sx;
          const dy = t.clientY - sy;
          if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
          const cur = getCurrentAyah();
          if (dx < 0) scrollToAyah(Math.min(TOTAL_AYAH, cur + 1));
          else scrollToAyah(Math.max(1, cur - 1));
        }, { passive: true });

      } catch {
        status.textContent = "Gagal memuatkan data. Pastikan data/yasin.json wujud.";
      }
    }

    /* ── WIRE CONTROLS ─────────────────────────────────────── */
    function wireControls() {
      document.getElementById("toggleMs").addEventListener("change", e => setShowMs(e.target.checked));
      document.getElementById("btnMinus").addEventListener("click", () => setArabSize(state.arSize - 2));
      document.getElementById("btnPlus").addEventListener("click", () => setArabSize(state.arSize + 2));
      document.getElementById("prevAyah").addEventListener("click", () => scrollToAyah(Math.max(1, getCurrentAyah() - 1)));
      document.getElementById("nextAyah").addEventListener("click", () => scrollToAyah(Math.min(TOTAL_AYAH, getCurrentAyah() + 1)));

      document.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft") scrollToAyah(Math.max(1, getCurrentAyah() - 1));
        if (e.key === "ArrowRight") scrollToAyah(Math.min(TOTAL_AYAH, getCurrentAyah() + 1));
      });

      const sheet = document.getElementById("sheet");
      document.getElementById("openSettings").addEventListener("click", () => sheet.classList.remove("hidden"));
      document.getElementById("closeSettings").addEventListener("click", () => sheet.classList.add("hidden"));
      document.getElementById("sheetBg").addEventListener("click", () => sheet.classList.add("hidden"));
      document.getElementById("toggleDark").addEventListener("click", () => {
        localStorage.setItem(LS_DARK, localStorage.getItem(LS_DARK) === "1" ? "0" : "1");
        applyDarkMode();
      });
    }

    applyDarkMode();
    wireControls();
    loadYasin();
  </script>
</body>
</html>
